services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: runpulse
      POSTGRES_USER: runpulse
      POSTGRES_PASSWORD: runpulse
    ports:
      - "5432:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runpulse -d runpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: runpulse
      RABBITMQ_DEFAULT_PASS: runpulse
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./api
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py seed_demo --if-empty && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://runpulse:runpulse@db:5432/runpulse
      RABBITMQ_URL: amqp://runpulse:runpulse@rabbitmq:5672/%2F
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672/api
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  consumer:
    build: ./api
    restart: unless-stopped
    command: python manage.py consume
    environment:
      DATABASE_URL: postgres://runpulse:runpulse@db:5432/runpulse
      RABBITMQ_URL: amqp://runpulse:runpulse@rabbitmq:5672/%2F
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672/api
      REDIS_URL: redis://redis:6379/0
    depends_on:
      web:
        condition: service_healthy

  worker:
    build: ./api
    restart: unless-stopped
    command: celery -A config worker -P threads -c 4 -l info
    environment:
      DATABASE_URL: postgres://runpulse:runpulse@db:5432/runpulse
      RABBITMQ_URL: amqp://runpulse:runpulse@rabbitmq:5672/%2F
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672/api
      REDIS_URL: redis://redis:6379/0
    depends_on:
      web:
        condition: service_healthy

  simulator:
    build: ./simulator
    command: python simulator.py gym --speedup 60
    environment:
      RABBITMQ_URL: amqp://runpulse:runpulse@rabbitmq:5672/%2F
    depends_on:
      web:
        condition: service_healthy

  ui:
    build: ./ui
    ports:
      - "8080:8080"
    depends_on:
      - web

volumes:
  tsdata:
  rabbitmqdata:
